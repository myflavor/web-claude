services:
  web-claude:
    build: .
    ports:
      - "3080:3080"
    environment:
      WEB_CLAUDE_TOKEN: password
      WEB_CLAUDE_PORT: "3080"
      WEB_CLAUDE_ROOT: /data
    volumes:
      - ./data:/data
      - ./settings.json:/home/claude/.claude/settings.json:ro
    restart: unless-stopped
