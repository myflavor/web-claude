services:
  web-claude:
    image: ghcr.io/myflavor/web-claude:latest
    ports:
      - 3080:3080
    environment:
      WEB_CLAUDE_TOKEN: password
      WEB_CLAUDE_PORT: 3080
      WEB_CLAUDE_ROOT: /data
      # NAS：填共享目录属主（ls -ln）。本机 1000 可保持默认。
      PUID: 1000
      PGID: 1000
    volumes:
      - ./data:/data
      - ./claude:/home/sandbox/.claude
      # SSH 密钥/known_hosts（git-over-SSH 用；放 ./ssh 下，私钥 600）
      - ./ssh:/home/sandbox/.ssh
    restart: unless-stopped
